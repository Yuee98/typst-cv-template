name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Dual-mode build (tmp/ai-polish-roadmap.md「双模式构建」CI 节): the static
# export (GitHub Pages) and the server build (Vercel) are gated by two
# independent jobs. Each job runs on its own checkout so that .next/, out/,
# and the generated API route files can never cross-contaminate the other
# mode. lint/typecheck/vitest deliberately run in BOTH jobs: the vitest suite
# is small, and this keeps each job a self-contained gate instead of paying a
# third checkout+install cycle for a standalone web-test job.
jobs:
  web-static-build:
    name: Web (static export)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build (static export)
        run: pnpm build:static

      - name: Assert static export artifact
        run: |
          set -euo pipefail

          # Pages serves web/out: it must exist and contain servable HTML.
          if [ ! -d web/out ]; then
            echo "::error::web/out does not exist after build:static."
            exit 1
          fi
          if ! find web/out -name '*.html' -print -quit | grep -q .; then
            echo "::error::web/out contains no HTML pages; the export is not servable by Pages."
            exit 1
          fi

          # Invariant 9: the static export must never ship AI API routes.
          # run-next-mode.mjs deletes the generated route files in static
          # mode and `output: export` never emits route handlers anyway, so
          # any web/out/api path means the mode wiring is broken.
          if [ -e web/out/api ]; then
            echo "::error::web/out/api exists in the static export; AI API routes must never ship to Pages (Invariant 9)."
            exit 1
          fi

  web-server-build:
    name: Web (server build)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # CI smoke configuration (unit 2.3): the fake LLM + fake backend let
      # `next build`/`next start` serve the full polish lifecycle without
      # Supabase or a DeepSeek key. NODE_ENV=production inside next build/start
      # is exempted by the CI=true marker GitHub Actions sets automatically
      # (see src/server/polish/provider.ts).
      POLISH_FAKE_LLM: "true"
      POLISH_FAKE_BACKEND: "true"
      AI_POLISH_ENABLED: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build (server)
        run: pnpm build:server

      - name: Smoke — 401 without token + fake-backend full chain
        run: |
          set -euo pipefail

          cd web

          # Next 16 `next start` defaults to port 3000 and has no dedicated
          # readiness endpoint, so pin an explicit port and poll HTTP until
          # the server answers with any status (a locale redirect counts).
          node_modules/.bin/next start -p 3100 > "${RUNNER_TEMP}/next-start.log" 2>&1 &
          server_pid=$!
          trap 'kill "${server_pid}" 2>/dev/null || true' EXIT

          status="000"
          for _ in $(seq 1 60); do
            status="$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3100/ || true)"
            if [ "${status}" != "000" ]; then
              break
            fi
            sleep 1
          done
          if [ "${status}" = "000" ]; then
            echo "::error::next start did not become ready within 60s. Log follows."
            cat "${RUNNER_TEMP}/next-start.log"
            exit 1
          fi
          echo "Server ready (HTTP ${status})."

          # Unit 2.3 lifecycle: token-less requests → 401 UNAUTHORIZED; with
          # the fake backend (POLISH_FAKE_LLM + POLISH_FAKE_BACKEND, job env)
          # a Bearer token drives the full chain to a 200 success shape
          # (scripts/smoke-polish-api.mjs).
          node scripts/smoke-polish-api.mjs http://localhost:3100

  web-e2e:
    name: Web E2E (server/Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # Keep the browser journey deterministic and credential-free. The
      # launcher also applies these values so local runs cannot inherit hosted
      # Supabase or DeepSeek credentials from a developer environment.
      POLISH_FAKE_LLM: "true"
      POLISH_FAKE_BACKEND: "true"
      AI_POLISH_ENABLED: "true"
      NEXT_PUBLIC_AI_POLISH_ENABLED: "false"
      NEXT_PUBLIC_SUPABASE_URL: ""
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ""
      SUPABASE_SERVICE_ROLE_KEY: ""
      DEEPSEEK_API_KEY: ""
      DEEPSEEK_BASE_URL: ""
      AI_USER_ID_HMAC_SECRET: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install pinned Chromium
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Run server-mode browser E2E
        run: pnpm --filter web test:e2e

      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-e2e-artifacts
          path: |
            web/test-results/
            web/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

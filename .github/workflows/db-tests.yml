name: DB integration tests

# Real-DB suite for the AI polish quota ledger, terms RLS and retention jobs
# (tmp/ai-polish-plan.md unit 1.4). Runs against a throwaway local Supabase
# inside the runner — never against a hosted project.
#
# The Supabase Docker stack is too expensive for every web-only PR, so this
# workflow runs automatically only when migrations or their production/test
# adapters change. workflow_dispatch remains available for release checkpoints.
# Local equivalent:
#   pnpm supabase:start
#   pnpm --filter web test:db:cfg001-fresh
#   pnpm --filter web test:db
on:
  pull_request:
    paths:
      - ".github/workflows/db-tests.yml"
      - "supabase/config.toml"
      - "supabase/migrations/**"
      - "supabase/seed.sql"
      - "web/package.json"
      - "web/scripts/run-cfg001-fresh-reset.mjs"
      - "web/scripts/run-db-tests.mjs"
      - "web/src/lib/cv/cloud-storage.ts"
      - "web/src/lib/legal/terms-acceptance.ts"
      - "web/src/server/polish/auth.ts"
      - "web/src/server/polish/deepseek-v2-seed-v1.ts"
      - "web/src/server/polish/deepseek-v2-seed-v1.test.ts"
      - "web/src/server/polish/lifecycle*.ts"
      - "web/src/server/polish/quota.ts"
      - "web/test/db/**"
      - "web/vitest.db.config.mts"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  db-tests:
    name: Web (real-DB tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      NEXT_TELEMETRY_DISABLED: "1"
      DB_TESTS_REQUIRED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The suite only needs postgres + PostgREST + GoTrue (+kong); excluding
      # the heavyweight extras keeps the manual run fast.
      - name: Start local Supabase
        run: pnpm exec supabase start -x studio,storage-api,imgproxy,edge-runtime,vector,pooler

      # Hard-fail proof of the exact post-migration seed cardinality and dark
      # feature state. The runner verifies loopback and resets before running
      # only the order-sensitive CFG-001 suite.
      - name: Run CFG-001 fresh-reset gate
        run: pnpm --filter web test:db:cfg001-fresh

      # Required mode makes status, local-API, and child-process failures hard
      # CI errors. The runner accepts only HTTP loopback endpoints and clears
      # the isolated selector before the ordinary full DB suite.
      - name: Run real-DB suite
        run: pnpm --filter web test:db

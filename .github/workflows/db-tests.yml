name: DB integration tests
on:
  pull_request:
    paths:
      - "supabase/**"
      - "scripts/**"
      - "web/src/**"
      - "web/test/**"
      - "web/scripts/**"
      - "web/*config*"
      - "**/package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/db-tests.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  db-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_TELEMETRY_DISABLED: "1"
      DB_TESTS_REQUIRED: "1"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Verify destructive-tool guards
        run: node --test scripts/*.test.ts
      - name: Verify loopback test guard
        run: pnpm --filter web exec vitest run scripts/run-db-tests.test.mjs
      - name: Start disposable local Supabase
        run: pnpm exec supabase start -x studio,realtime,logflare,vector,postgres-meta,imgproxy,supavisor,edge-runtime
      - name: Rebuild current baseline
        run: pnpm exec supabase db reset --local --no-seed --yes
      - name: Database constraints and role permissions
        run: pnpm exec supabase test db --local
      - name: API and concurrency integration
        run: pnpm --filter web test:db
      - name: Two-connection AI ledger concurrency
        env:
          CV_DB_CONCURRENCY_CONTAINER: supabase_db_typst-cv-template
        run: node scripts/db-ai-concurrency.ts --run-disposable
      - name: Prepare independent historical application fixture
        run: node scripts/db-remote-rehearsal.ts --mode=prepare
      - name: Start independent rehearsal database
        run: node scripts/db-remote-rehearsal.ts --mode=start-db
      - name: Copy platform schema and migration metadata only
        run: node scripts/db-remote-rehearsal.ts --mode=platform
      - name: Apply historical migration fixture
        run: node scripts/db-remote-rehearsal.ts --mode=legacy
      - name: Rehearse application allowlist rebuild and resume
        run: node scripts/db-remote-rehearsal.ts --mode=run
      - name: Reject missing checkpoints and recover inspected state
        run: node scripts/db-remote-rehearsal.ts --mode=checkpoint-guards
      - name: Verify platform preservation proof
        run: node scripts/db-remote-rehearsal.ts --mode=verify
      - name: Install pinned Chromium
        run: pnpm --filter web exec playwright install --with-deps chromium
      - name: Real local Auth and TOTP browser tests
        run: pnpm --filter web test:e2e:admin
      - name: Upload local rehearsal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: database-rehearsal-evidence
          path: |
            tmp/remote-rehearsal-proof.json
            tmp/g3-instance.json
            tmp/g3-platform-origin.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop independent rehearsal database
        if: always()
        run: docker rm -f supabase_db_cv-remote-rehearsal 2>/dev/null || true
      - name: Stop disposable runtime
        if: always()
        run: pnpm exec supabase stop --no-backup

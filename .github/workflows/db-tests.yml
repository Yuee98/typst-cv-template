name: DB integration tests

# Real-DB suite for the AI polish quota ledger, terms RLS and retention jobs
# (tmp/ai-polish-plan.md unit 1.4). Runs against a throwaway local Supabase
# inside the runner — never against a hosted project.
#
# The Supabase Docker stack is too expensive for every web-only PR, so this
# workflow runs automatically only when migrations or their production/test
# adapters change. workflow_dispatch remains available for release checkpoints.
# Local equivalent:
#   pnpm supabase:start
#   pnpm --filter web test:db:cfg001-fresh
#   node web/scripts/run-cfg002-fresh-reset.mjs
#   node web/scripts/run-cfg003-fresh-reset.mjs
#   pnpm --filter web test:db
on:
  pull_request:
    paths:
      - ".github/workflows/db-tests.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "supabase/config.toml"
      - "supabase/migrations/**"
      - "supabase/seed.sql"
      - "web/package.json"
      - "web/scripts/run-cfg001-fresh-reset.mjs"
      - "web/scripts/run-cfg002-fresh-reset.mjs"
      - "web/scripts/run-cfg003-fresh-reset.mjs"
      - "web/scripts/run-db-tests.mjs"
      - "web/scripts/run-db-tests.test.mjs"
      - "web/vitest.config.mts"
      - "web/src/lib/cv/cloud-storage.ts"
      - "web/src/lib/legal/legal-display-v2.ts"
      - "web/src/lib/legal/terms-acceptance.ts"
      - "web/src/lib/admin/**"
      - "web/src/server/admin/**"
      - "web/src/server/polish/auth.ts"
      - "web/src/server/polish/deepseek-v2-seed-v1.ts"
      - "web/src/server/polish/deepseek-v2-seed-v1.test.ts"
      - "web/src/server/polish/deepseek.ts"
      - "web/src/server/polish/mimo.ts"
      - "web/src/server/polish/execution-snapshot-v2.ts"
      - "web/src/server/polish/handler-runtime-authority.ts"
      - "web/src/server/polish/legal-display-reader-v2.ts"
      - "web/src/server/polish/prepared-provider-execution-v2.ts"
      - "web/src/server/polish/profile-execution-v2.ts"
      - "web/src/server/polish/provider-binding-v2.ts"
      - "web/src/server/polish/runtime-code-capability-v2.ts"
      - "web/src/server/polish/g4-routing-policy-seed-v1.ts"
      - "web/src/server/polish/g4-routing-policy-seed-v1.test.ts"
      - "web/src/server/polish/routing-rules-v1.test.ts"
      - "web/test/fixtures/routing-rules-v1.json"
      - "web/src/server/polish/lifecycle*.ts"
      - "web/src/server/polish/quota.ts"
      - "web/test/fixtures/admin-contract-v1.json"
      - "web/test/fixtures/profile-execution-v2.json"
      - "web/test/db/**"
      - "web/vitest.db.config.mts"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  db-tests:
    name: Web (real-DB tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      NEXT_TELEMETRY_DISABLED: "1"
      DB_TESTS_REQUIRED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # This is deliberately credential-free and must run before Docker-backed
      # tests. It proves the required/optional behavior, loopback-only target
      # guard, isolated-selector clearing, and child-process failure handling
      # that make the real-DB gate safe to invoke.
      - name: Verify DB test runner contract (credential-free)
        run: pnpm --filter web exec vitest run scripts/run-db-tests.test.mjs

      # The suite only needs postgres + PostgREST + GoTrue (+kong); excluding
      # the heavyweight extras keeps the manual run fast.
      - name: Start local Supabase
        run: pnpm exec supabase start -x studio,storage-api,imgproxy,edge-runtime,vector,pooler

      # Hard-fail proof of the exact post-migration seed cardinality and dark
      # feature state. The runner verifies loopback and resets before running
      # only the order-sensitive CFG-001 suite.
      - name: Run CFG-001 fresh-reset gate
        run: pnpm --filter web test:db:cfg001-fresh

      - name: Run CFG-002 fresh-reset gate
        run: node web/scripts/run-cfg002-fresh-reset.mjs

      - name: Run CFG-003 fresh-reset gate
        run: node web/scripts/run-cfg003-fresh-reset.mjs

      # Required mode makes status, local-API, and child-process failures hard
      # CI errors. The runner accepts only HTTP loopback endpoints and clears
      # the isolated selector before the ordinary full DB suite.
      - name: Run real-DB suite
        run: pnpm --filter web test:db
